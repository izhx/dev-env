services:
  dev:
    image: daily-dev:${USER_MODE:-dev}${INSTALL_DOCKER_CLI:+-docker}${INSTALL_CLAUDE:+-claude}${INSTALL_CODEX:+-codex}

    build:
      context: .
      dockerfile: Dockerfile
      target: ${USER_MODE:-dev}-docker-${INSTALL_DOCKER_CLI:-false}
      network: ${BUILD_NETWORK:-default}
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12-bookworm}
        NODE_VERSION: ${NODE_VERSION:-24-bookworm-slim}
        UV_VERSION: ${UV_VERSION:-0.12.5}
        DOCKER_CLI_VERSION: ${DOCKER_CLI_VERSION:-28.5.1-cli}
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
        IN_MAINLAND: ${IN_MAINLAND:-false}
        INSTALL_CLAUDE: ${INSTALL_CLAUDE:-false}
        INSTALL_CODEX: ${INSTALL_CODEX:-false}
        CLAUDE_VERSION: ${CLAUDE_VERSION:-latest}
        CODEX_VERSION: ${CODEX_VERSION:-latest}
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: ${no_proxy:-}
        HTTP_PROXY: ${http_proxy:-}
        HTTPS_PROXY: ${https_proxy:-}
        NO_PROXY: ${no_proxy:-}

    hostname: container
    extra_hosts: container
      - "container:127.0.1.1"
    init: true
    stdin_open: true
    tty: true
    environment:
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      no_proxy: ${no_proxy:-}
      HTTP_PROXY: ${http_proxy:-}
      HTTPS_PROXY: ${https_proxy:-}
      NO_PROXY: ${no_proxy:-}
      SSH_PUBLIC_KEY: ${SSH_PUBLIC_KEY:-}
    ports:
      - "${SSH_BIND_IP:-127.0.0.1}:${SSH_HOST_PORT:-2222}:22"

    # Add the docker group to the container, link the docker socket.
    group_add:
      - "${DOCKER_GID}"
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        bind:
          create_host_path: false

     # Agent data uses fixed targets.
      - type: bind
        source: ${CLAUDE_DATA_DIR}
        target: /agent-data/claude
        bind:
          create_host_path: false
      - type: bind
        source: ${CODEX_DATA_DIR}
        target: /agent-data/codex
        bind:
          create_host_path: false
